<VirtualHost *:80>
    ServerName zapby.com.br
    ServerAlias www.zapby.com.br
    DocumentRoot /var/www/zapby/public

    <Directory /var/www/zapby/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>
    
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    </FilesMatch>
    
    ErrorLog /var/log/httpd/zapby_error.log
    CustomLog /var/log/httpd/zapby_access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =zapby.com.br [OR]
    RewriteCond %{SERVER_NAME} =www.zapby.com.br
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName zapby.com.br
    ServerAlias www.zapby.com.br
    DocumentRoot /var/www/zapby/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/zapby.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/zapby.com.br/privkey.pem

    # Headers de segurança para PWA
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    
    # Content Security Policy para PWA
    Header always set Content-Security-Policy "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https:; script-src 'self' https: 'unsafe-inline' 'unsafe-eval' cdn.tailwindcss.com"

    <Directory /var/www/zapby/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>
    
    # Cache para arquivos do PWA
    <FilesMatch "\.(ico|jpg|jpeg|png|gif|webp|svg|css|js|json|woff|woff2|ttf|eot)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    
    # Manifest e Service Worker não devem ser cacheados agressivamente
    <FilesMatch "manifest\.json|sw\.js">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>
    
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    </FilesMatch>
    
    ErrorLog /var/log/httpd/zapby_error.log
    CustomLog /var/log/httpd/zapby_access.log combined
</VirtualHost>
